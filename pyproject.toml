[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "j-cli"
version = "0.1.0"
description = "Jamie, an assistant."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "prompt-toolkit>=3.0,<4",
    "pydantic>=2.10,<3",
    "rich>=14,<15",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[project.scripts]
jamie = "assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.hatch.build.targets.wheel.force-include]
"evals/cases" = "assistant/eval_cases"
"evals/agent_cases" = "assistant/agent_eval_cases"
"evals/research_cases" = "assistant/research_eval_cases"
"evals/memory_cases" = "assistant/memory_eval_cases"
"evals/interactive_cases" = "assistant/interactive_eval_cases"
"evals/benchmark_cases" = "assistant/benchmark_eval_cases"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
