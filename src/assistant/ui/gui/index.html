<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline' 'unsafe-eval'; font-src data:; img-src data:"
    />
    <title>Jamie</title>
    <style>
      /* fonts */

      /* Colours, type, and spacing follow jameshliu.me. */
      :root {
        --page: #ffffff;
        --ink: #293342;
        --muted: #677384;
        --line: #e9edf2;
        --surface: #f4f6f9;
        --accent: #476ca8;
        --accent-hover: #2d548e;
        --card: #f4f7fc;
        --card-line: #e5ebf5;
        --done: #83ada4;
        --danger: #b5534b;
        --shadow: #0d1d3514;
        --sans: "DM Sans", -apple-system, Arial, sans-serif;
        --mono: "SFMono-Regular", Menlo, Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --page: #151a22;
          --ink: #e5eaf2;
          --muted: #a0adbf;
          --line: #2a3341;
          --surface: #202834;
          --accent: #9abbed;
          --accent-hover: #c1d6f7;
          --card: #1c2635;
          --card-line: #2a3a50;
          --done: #8bb9af;
          --danger: #e59a92;
          --shadow: #00000040;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --page: #151a22;
        --ink: #e5eaf2;
        --muted: #a0adbf;
        --line: #2a3341;
        --surface: #202834;
        --accent: #9abbed;
        --accent-hover: #c1d6f7;
        --card: #1c2635;
        --card-line: #2a3a50;
        --done: #8bb9af;
        --danger: #e59a92;
        --shadow: #00000040;
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.75 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      ::selection {
        background: var(--accent);
        color: var(--page);
      }
      p,
      h1 {
        margin: 0;
      }
      h1 {
        font-weight: 500;
      }
      button {
        color: inherit;
        font: inherit;
        cursor: pointer;
        transition:
          color 180ms,
          background-color 180ms,
          border-color 180ms;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      .sprite {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
      }
      .icon {
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
      }
      .icon-button:hover {
        color: var(--accent);
        background: var(--surface);
      }
      .sun-icon {
        display: none;
      }
      .dark .sun-icon {
        display: block;
      }
      .dark .moon-icon {
        display: none;
      }

      .column {
        width: calc(100% - 64px);
        max-width: 680px;
        margin: 0 auto;
      }
      header {
        flex: none;
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 72px;
      }
      .monogram {
        color: var(--accent);
        font-size: 25px;
        font-weight: 500;
        letter-spacing: -0.07em;
        line-height: 1;
      }
      .meta {
        margin-left: auto;
        min-width: 0;
        overflow: hidden;
        font-size: 11px;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        align-items: center;
      }

      main {
        flex: 1;
        overflow-y: auto;
      }
      .intro {
        padding: 44px 0 40px;
      }
      .intro-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .intro-meta::before {
        content: "";
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .intro-meta.ready::before {
        background: var(--done);
        animation: none;
      }
      .intro-meta.fatal {
        align-items: baseline;
        color: var(--danger);
        white-space: pre-wrap;
      }
      .intro-meta.fatal::before {
        background: var(--danger);
        animation: none;
      }
      .intro h1 {
        margin: 15px 0 18px -3px;
        font-size: 56px;
        line-height: 1.12;
        letter-spacing: -0.06em;
      }
      .lead {
        max-width: 540px;
        font-size: 20px;
        line-height: 1.6;
        letter-spacing: -0.025em;
      }
      .lead + p {
        max-width: 560px;
        margin-top: 14px;
        color: var(--muted);
        line-height: 1.85;
      }
      .suggestions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 25px;
        margin-top: 22px;
      }
      .suggestions button {
        min-height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        font-size: 12px;
      }
      .suggestions button:hover {
        color: var(--accent-hover);
        text-decoration: underline;
        text-underline-offset: 5px;
      }

      .turn {
        padding-top: 30px;
      }
      .turn:last-child {
        padding-bottom: 30px;
      }
      .eyebrow {
        margin-bottom: 6px;
        font-size: 11px;
        line-height: 1.6;
        color: var(--accent);
      }
      .user {
        padding: 14px 20px;
        border: 1px solid var(--card-line);
        border-radius: 14px;
        background: var(--card);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .reply {
        margin-top: 22px;
      }
      .tools {
        display: grid;
        gap: 2px;
        margin-bottom: 8px;
      }
      .tool {
        display: flex;
        align-items: baseline;
        gap: 9px;
        font-size: 12px;
        line-height: 1.8;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .tool::before {
        content: "";
        flex: none;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        transform: translateY(-1px);
      }
      .tool.running::before {
        animation: pulse 1.2s ease-in-out infinite;
      }
      .tool.done::before {
        background: var(--done);
      }
      .tool.failed::before {
        background: var(--danger);
      }
      .tool-detail {
        padding-left: 15px;
        font-size: 11px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .answer {
        overflow-wrap: anywhere;
      }
      .answer p {
        white-space: pre-wrap;
      }
      .answer p + p,
      .answer p + pre,
      .answer pre + p,
      .answer pre + pre {
        margin-top: 14px;
      }
      .answer code {
        padding: 1px 5px;
        border-radius: 5px;
        background: var(--surface);
        color: var(--accent);
        font: 12px var(--mono);
      }
      .answer pre {
        margin: 0;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--surface);
        overflow-x: auto;
      }
      .answer pre code {
        padding: 0;
        background: none;
        color: var(--ink);
        line-height: 1.7;
      }
      .command-output {
        margin: 0;
        padding: 12px 16px;
        border-radius: 10px;
        background: var(--surface);
        color: var(--ink);
        font: 12px/1.7 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .command-output.restored {
        margin-top: 30px;
      }
      .approval {
        margin: 6px 0 10px;
        padding: 16px 20px;
        border: 1px solid var(--card-line);
        border-left: 3px solid var(--accent);
        border-radius: 14px;
        background: var(--card);
      }
      .approval-heading {
        font-size: 13px;
        color: var(--muted);
      }
      .approval-subject {
        margin: 6px 0 2px;
        color: var(--ink);
        font: 13px/1.7 var(--mono);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .approval-detail {
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .approval-detail span,
      .approval-footer,
      .approval-result {
        color: var(--muted);
      }
      .approval-footer {
        margin-top: 8px;
        font-size: 11px;
      }
      .approval-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      .approval-actions button {
        min-height: 32px;
        padding: 0 14px;
        border-radius: 8px;
        font-size: 12px;
      }
      .approval-actions .primary {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--page);
      }
      .approval-actions .primary:hover {
        background: var(--accent-hover);
      }
      .approval-actions .secondary {
        border: 1px solid var(--line);
        background: var(--page);
        color: var(--ink);
      }
      .approval-actions .secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      .approval-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .approval-result {
        font-size: 12px;
      }
      .approval.answered {
        border-left-color: var(--done);
      }
      .approval.deny {
        border-left-color: var(--danger);
      }
      .note {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .note.error {
        color: var(--danger);
      }
      .thinking {
        display: flex;
        gap: 5px;
        padding: 10px 0 2px;
      }
      .thinking span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .thinking span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .thinking span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }

      footer {
        flex: none;
        padding: 6px 0 16px;
      }
      .composer {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 8px 8px 8px 18px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--page);
        box-shadow: 0 10px 34px var(--shadow);
        transition: border-color 180ms;
      }
      .composer:focus-within {
        border-color: var(--accent); /* the composer, not the textarea, shows focus */
      }
      textarea {
        flex: 1;
        min-height: 36px;
        max-height: 220px;
        padding: 6px 0;
        border: 0;
        outline: none;
        resize: none;
        background: transparent;
        color: var(--ink);
        font: 15px/1.6 var(--sans);
      }
      textarea::placeholder {
        color: var(--muted);
      }
      .send {
        flex: none;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: var(--page);
      }
      .send:hover {
        background: var(--accent-hover);
      }
      .send:disabled {
        background: var(--line);
        color: var(--muted);
        cursor: default;
      }
      .hint {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
      }

      @media (max-width: 560px) {
        .column {
          width: calc(100% - 40px);
        }
        .intro h1 {
          font-size: 46px;
        }
        .lead {
          font-size: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"></circle>
        <path
          d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
        ></path>
      </symbol>
      <symbol id="moon" viewBox="0 0 24 24">
        <path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"></path>
      </symbol>
      <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
      <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"></path></symbol>
      <symbol id="stop" viewBox="0 0 24 24">
        <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"></rect>
      </symbol>
    </svg>

    <header class="column">
      <span class="monogram" aria-label="Jamie">jamie.</span>
      <span class="meta" id="meta" title="{{workspace}}">{{workspace}}</span>
      <div class="actions">
        <button class="icon-button" id="new" type="button" title="New conversation">
          <svg class="icon" aria-hidden="true"><use href="#plus"></use></svg>
          <span hidden>New conversation</span>
        </button>
        <button class="icon-button" id="theme" type="button" title="Switch theme">
          <svg class="icon moon-icon" aria-hidden="true"><use href="#moon"></use></svg>
          <svg class="icon sun-icon" aria-hidden="true"><use href="#sun"></use></svg>
        </button>
      </div>
    </header>

    <main id="main">
      <div class="column" id="thread" aria-live="polite">
        <section class="intro" id="intro">
          <p class="intro-meta" id="status">Connecting to the local model…</p>
          <h1>Jamie</h1>
          <p class="lead">Ask anything, or have Jamie work with your files, apps, and the web.</p>
          <p>
            The model runs on this Mac. Only web searches and the pages Jamie reads leave
            it.
          </p>
          <div class="suggestions">
            <button type="button">What files are in this folder?</button>
            <button type="button">Search the web for today’s top story</button>
            <button type="button">Open Safari</button>
          </div>
        </section>
      </div>
    </main>

    <footer class="column">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message Jamie" aria-label="Message Jamie"></textarea>
        <button class="send" id="send" type="submit" title="Send" disabled>
          <svg class="icon" aria-hidden="true"><use href="#up"></use></svg>
        </button>
      </form>
      <p class="hint">Enter to send · Shift+Enter for a new line · Esc to stop · /help for commands</p>
    </footer>

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const main = $("main");
      const thread = $("thread");
      const input = $("input");
      const send = $("send");
      const intro = $("intro").cloneNode(true);
      let busy = false;
      let turn = null; // { reply, tools, answer, raw, running, thinking }

      // pywebview injects its bridge after the page loads.
      function api() {
        if (window.pywebview?.api) return Promise.resolve(window.pywebview.api);
        return new Promise((resolve) =>
          window.addEventListener("pywebviewready", () => resolve(window.pywebview.api), {
            once: true,
          }),
        );
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      // Model text is untrusted: build nodes and set textContent, never innerHTML.
      function inline(parent, text) {
        text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach((part, index) => {
          if (index % 2 === 0) parent.append(part);
          else if (part.startsWith("`")) parent.append(el("code", "", part.slice(1, -1)));
          else parent.append(el("strong", "", part.slice(2, -2)));
        });
      }
      function format(node, text) {
        node.replaceChildren();
        text.split(/```[^\n]*\n?([\s\S]*?)```/).forEach((part, index) => {
          if (index % 2 === 1) {
            const pre = el("pre");
            pre.append(el("code", "", part.replace(/\n$/, "")));
            node.append(pre);
            return;
          }
          part
            .split(/\n{2,}/)
            .map((paragraph) => paragraph.trim())
            .filter(Boolean)
            .forEach((paragraph) => {
              const p = el("p");
              inline(p, paragraph);
              node.append(p);
            });
        });
      }

      function nearBottom() {
        return main.scrollHeight - main.scrollTop - main.clientHeight < 120;
      }
      function follow(update) {
        const stick = nearBottom();
        update();
        if (stick) main.scrollTop = main.scrollHeight;
      }

      function setBusy(value) {
        busy = value;
        send.title = busy ? "Stop" : "Send";
        send.querySelector("use").setAttribute("href", busy ? "#stop" : "#up");
        refreshSend();
      }
      function refreshSend() {
        send.disabled = !busy && (!server.ready || !input.value.trim());
      }
      // The model server's state, shown in the intro and kept for a new conversation.
      const server = { ready: false, model: "", text: "Connecting to the local model…", state: "" };
      function showServer() {
        const status = $("status");
        if (!status) return;
        status.textContent = server.text;
        status.className = `intro-meta ${server.state}`;
      }
      function resize() {
        input.style.height = "auto";
        input.style.height = `${Math.min(input.scrollHeight, 220)}px`;
      }

      function exchange(text) {
        const section = el("section", "turn");
        section.append(el("p", "eyebrow", "You"), el("div", "user", text));
        const reply = el("div", "reply");
        reply.append(el("p", "eyebrow", "Jamie"));
        section.append(reply);
        return { section, reply };
      }
      function startTurn(text) {
        $("intro")?.remove();
        const { section, reply } = exchange(text);
        const tools = el("div", "tools");
        tools.hidden = true;
        const thinking = el("div", "thinking");
        thinking.append(el("span"), el("span"), el("span"));
        reply.append(tools, thinking);
        thread.append(section);
        main.scrollTop = main.scrollHeight; // a new message always brings the view down
        turn = { reply, tools, thinking, answer: null, raw: "", running: null };
      }
      function showConversation(messages, text) {
        if (!messages.length) {
          thread.replaceChildren(intro.cloneNode(true));
          showServer();
          return;
        }
        thread.replaceChildren();
        for (let index = 0; index < messages.length; index += 2) {
          const { section, reply } = exchange(messages[index].text);
          const answer = el("div", "answer");
          format(answer, messages[index + 1]?.text ?? "");
          reply.append(answer);
          thread.append(section);
        }
        if (text) thread.append(el("pre", "command-output restored", text));
        main.scrollTop = main.scrollHeight;
      }

      // A request the user answers with a click. Nothing is focused automatically, so
      // pressing Enter while typing can never approve an action.
      const CHOICES = {
        once: "Allowed once.",
        session: "Allowed for this session.",
        deny: "Denied.",
      };
      function approvalCard(payload) {
        const card = el("div", "approval");
        card.dataset.id = payload.id;
        card.append(el("p", "approval-heading", payload.heading));
        if (payload.subject !== null) card.append(el("pre", "approval-subject", payload.subject));
        for (const [name, value] of payload.details) {
          const row = el("p", "approval-detail");
          row.append(el("span", "", `${name}: `), value);
          card.append(row);
        }
        card.append(el("p", "approval-footer", `Tool: ${payload.tool} · ${payload.footer}`));
        const actions = el("div", "approval-actions");
        const options = [["once", "Allow once", "primary"]];
        if (payload.session) options.push(["session", "Allow for this session", "secondary"]);
        options.push(["deny", "Deny", "secondary"]);
        for (const [choice, label, kind] of options) {
          const button = el("button", kind, label);
          button.type = "button";
          button.addEventListener("click", async () => {
            actions.querySelectorAll("button").forEach((b) => (b.disabled = true));
            await (await api()).approve(payload.id, choice);
          });
          actions.append(button);
        }
        card.append(actions);
        return card;
      }
      function closeApproval(payload) {
        const card = thread.querySelector(`.approval[data-id="${CSS.escape(payload.id)}"]`);
        if (!card) return;
        card.classList.add("answered", payload.choice);
        card.querySelector(".approval-actions").replaceChildren(
          el("p", "approval-result", CHOICES[payload.choice] ?? "Answered."),
        );
      }
      function answerNode() {
        if (!turn.answer) {
          turn.answer = el("div", "answer");
          turn.thinking.before(turn.answer);
        }
        return turn.answer;
      }
      function note(text, className = "note") {
        turn.thinking.before(el("p", className, text));
      }

      async function submit(text) {
        if (busy || !server.ready || !text.trim()) return;
        startTurn(text.trim());
        setBusy(true);
        input.value = "";
        resize();
        refreshSend();
        const accepted = await (await api()).send(text);
        if (!accepted) {
          note("Jamie is busy or the message was empty.", "note error");
          finishTurn();
        }
      }
      function finishTurn() {
        if (turn) turn.thinking.remove();
        turn = null;
        setBusy(false);
        input.focus();
      }

      window.jamie = {
        receive(payload) {
          switch (payload.type) {
            case "status":
            case "fatal":
              server.text = payload.text ?? payload.lines.join("\n");
              server.state = payload.type === "fatal" ? "fatal" : "";
              showServer();
              return;
            case "ready":
              Object.assign(server, {
                ready: true,
                model: payload.model,
                text: `Running locally · ${payload.model}${
                  payload.shortcut ? ` · ${payload.shortcut} brings Jamie back from anywhere` : ""
                }`,
                state: "ready",
              });
              $("meta").textContent = `${payload.model} · ${$("meta").title}`;
              showServer();
              refreshSend();
              return;
            case "idle":
              if (payload.workspace) {
                $("meta").title = payload.workspace;
                $("meta").textContent = `${server.model} · ${payload.workspace}`;
              }
              finishTurn();
              return;
            case "clear":
              thread.replaceChildren();
              turn = null;
              return;
            case "conversation":
              turn = null;
              showConversation(payload.messages, payload.note);
              return;
            case "approval-closed":
              closeApproval(payload);
              return;
          }
          if (!turn) return;
          follow(() => {
            switch (payload.type) {
              case "tool": {
                turn.tools.hidden = false;
                let line = payload.state !== "running" ? turn.running : null;
                if (!line) {
                  line = el("div", "tool");
                  turn.tools.append(line);
                }
                line.className = `tool ${payload.state}`;
                line.textContent = payload.text;
                turn.running = payload.state === "running" ? line : null;
                for (const detail of payload.detail || []) {
                  turn.tools.append(el("div", "tool-detail", detail));
                }
                break;
              }
              case "approval":
                turn.thinking.before(approvalCard(payload));
                break;
              case "delta":
                turn.raw += payload.text;
                answerNode().textContent = turn.raw;
                break;
              case "answer":
                format(answerNode(), payload.text);
                if (payload.truncated) note("The response reached the token limit.");
                break;
              case "command":
                turn.thinking.before(el("pre", "command-output", payload.text));
                break;
              case "error":
                note(payload.lines.join("\n"), "note error");
                break;
              case "cancelled":
                note("Stopped.");
                break;
            }
          });
        },
      };

      $("composer").addEventListener("submit", (event) => {
        event.preventDefault();
        if (busy) api().then((bridge) => bridge.cancel());
        else submit(input.value);
      });
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          submit(input.value);
        }
      });
      input.addEventListener("input", () => {
        resize();
        refreshSend();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && busy) api().then((bridge) => bridge.cancel());
      });
      thread.addEventListener("click", (event) => {
        const button = event.target.closest(".suggestions button");
        if (button) submit(button.textContent);
      });
      $("new").addEventListener("click", async () => {
        if (busy || !(await (await api()).new_conversation())) return;
        thread.replaceChildren(intro.cloneNode(true));
        showServer();
        input.focus();
      });

      const root = document.documentElement;
      const system = window.matchMedia("(prefers-color-scheme: dark)");
      function applyTheme() {
        const dark = root.dataset.theme ? root.dataset.theme === "dark" : system.matches;
        root.classList.toggle("dark", dark);
        $("theme").title = dark ? "Switch to light theme" : "Switch to dark theme";
      }
      $("theme").addEventListener("click", () => {
        root.dataset.theme = root.classList.contains("dark") ? "light" : "dark";
        applyTheme();
      });
      system.addEventListener("change", applyTheme);
      window.addEventListener("focus", () => input.focus()); // after the shortcut or Dock
      applyTheme();
      input.focus();
    </script>
  </body>
</html>
